name: Android (AAB signé)

# Fabrique le paquet Google Play (.aab) de l'application Android (Trusted Web Activity).
# Déclenchement : manuel (Actions → Android → Run workflow) ou à chaque changement du dossier android/.
on:
  workflow_dispatch:
    inputs:
      twa_host:
        description: "Domaine du site ouvert par l'application"
        default: "cheztata.app"
        required: true
      version_name:
        description: "Nom de version affiché (ex. 1.0.0)"
        default: "1.0.0"
        required: true
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWA_HOST: ${{ inputs.twa_host || 'cheztata.app' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # La clé d'envoi n'est jamais dans le dépôt : elle vient des secrets GitHub (Settings → Secrets and variables → Actions).
      # Les pull requests (y compris depuis un fork) n'ont pas accès aux secrets : le paquet reste alors non signé.
      - name: Préparer la clé de signature
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret KEYSTORE_BASE64 absent : le .aab sera NON signé (inutilisable sur Google Play)."
          fi

      - name: Construire le .aab
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -z "$ANDROID_KEYSTORE_FILE" ] && unset ANDROID_KEYSTORE_FILE
          gradle -p android bundleRelease \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="$VERSION_NAME" \
            --no-daemon --stacktrace

      - name: Supprimer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: cheztata-${{ steps.keystore.outputs.signed == 'true' && 'signe' || 'NON-signe' }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
