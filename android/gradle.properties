org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Adresse du site ouvert par l'application. Surchargeable : -PtwaHost=exemple.fr ou variable TWA_HOST.
twaHost=cheztata.app
# Page d'ouverture (la même que start_url du manifeste web).
twaStartPath=/aujourdhui
# Identifiant de l'application : DÉFINITIF une fois publiée sur Google Play.
appId=app.cheztata.android
